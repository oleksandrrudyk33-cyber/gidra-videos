name: Build APK
on:
  push:
    branches: [main]
    paths: ["publisher-app/**", ".github/workflows/build-apk.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.7" }
      - name: Build debug APK
        working-directory: publisher-app
        run: gradle assembleDebug --no-daemon
      - name: Publish APK to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk
          name: Gidra Publisher (APK)
          body: Останній збір застосунку Gidra Publisher. Завантаж app-debug.apk на телефон.
          files: publisher-app/app/build/outputs/apk/debug/app-debug.apk
